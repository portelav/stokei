<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos | Stokei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 11V3a1 1 0 0 1 1-1h8l11 11-9 9z' fill='%23f5c518' stroke='%2316324a' stroke-width='1.5'/%3E%3Ccircle cx='7' cy='7' r='1.8' fill='%2316324a'/%3E%3C/svg%3E">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <aside class="lateral">
    <a class="marca" href="index.html">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 11V3a1 1 0 0 1 1-1h8l11 11-9 9z" fill="#f5c518"/><circle cx="7" cy="7" r="1.8" fill="#16324a"/></svg>
      Stokei
    </a>
    <nav class="menu" aria-label="Principal">
      <ul>
        <li><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a></li>
        <li><a href="produtos.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Produtos</a></li>
        <li><a href="movimentacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4"/><path d="m3 8 4-4 4 4"/><path d="M17 4v16"/><path d="m13 16 4 4 4-4"/></svg>Movimentações</a></li>
        <li><a href="historico.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</a></li>
      </ul>
    </nav>
    <p class="status-api" id="status-api"><span class="ponto" aria-hidden="true"></span><span class="texto">Conectando à API</span></p>
  </aside>

  <main id="conteudo">
    <header class="topo-pagina">
      <div>
        <h1>Produtos</h1>
        <p>Cadastre produtos, busque e acompanhe o nível de estoque de cada um.</p>
      </div>
      <button class="botao" type="button" id="abrir-cadastro" aria-expanded="false" aria-controls="cadastro">Cadastrar produto</button>
    </header>

    <section class="painel" id="cadastro" aria-labelledby="t-cadastro" hidden>
      <h2 id="t-cadastro">Novo produto</h2>
      <form id="form-produto" class="formulario">
        <div class="campos">
          <label class="campo"><span>Código</span><input name="codigo" maxlength="30" placeholder="ARZ-05" autocomplete="off"><small>Opcional. Não pode repetir.</small></label>
          <label class="campo largo"><span>Nome</span><input name="nome" required maxlength="100" placeholder="Arroz 5kg" autocomplete="off"></label>
          <label class="campo"><span>Categoria</span><input name="categoria" maxlength="50" placeholder="Mercearia" list="categorias" autocomplete="off"></label>
          <label class="campo"><span>Quantidade inicial</span><input name="quantidade" type="number" min="0" step="1" value="0" required inputmode="numeric"></label>
          <label class="campo"><span>Estoque mínimo</span><input name="minimo" type="number" min="0" step="1" value="0" required inputmode="numeric"><small>Abaixo disso, o produto entra em alerta.</small></label>
          <label class="campo"><span>Preço (R$)</span><input name="preco" type="number" min="0" step="0.01" value="0" required inputmode="decimal"></label>
        </div>
        <datalist id="categorias"></datalist>
        <div class="acoes-form">
          <button class="botao" type="submit">Cadastrar produto</button>
          <button class="botao claro" type="button" id="fechar-cadastro">Fechar</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="t-lista">
      <h2 id="t-lista" class="visualmente-oculto">Lista de produtos</h2>
      <div class="filtros">
        <label class="campo"><span>Buscar</span><input id="busca" type="search" placeholder="Nome, código ou categoria" autocomplete="off"></label>
        <label class="marcar"><input type="checkbox" id="so-baixos"> Só abaixo do mínimo</label>
        <p class="contagem" id="contagem" aria-live="polite"></p>
      </div>
      <div class="tabela cartoes">
        <table>
          <thead>
            <tr>
              <th>Código</th><th>Produto</th><th>Estoque</th><th class="num">Preço</th>
              <th class="num">Valor em estoque</th><th>Situação</th><th><span class="visualmente-oculto">Ações</span></th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="comum.js"></script>
  <script src="produtos.js"></script>
</body>
</html>
